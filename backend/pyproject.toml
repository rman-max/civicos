[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "civicos-api"
version = "0.1.0"
description = "CivicOS API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.139.2",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.10",
  "PyJWT[crypto]==2.10.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civicos_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/civicos_api/briefings.py" = ["E501"]
"src/civicos_api/notebooks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
