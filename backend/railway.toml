[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "database/migrations/**"]

[deploy]
preDeployCommand = ["python -m civicos_api.migrations && python -m civicos_api.bootstrap_founder"]
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
