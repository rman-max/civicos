[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicos-ingestion"
version = "0.1.0"
description = "Autonomous, policy-bound civic source discovery worker."
requires-python = ">=3.12"
dependencies = [
  "boto3==1.40.31",
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "pypdf==6.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civicos_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "defusedxml"]
ignore_missing_imports = true
